# Complexity ceiling for this crate, denied in Cargo.toml's [lints.clippy].
#
# Cognitive rather than cyclomatic complexity: `?` makes every fallible call a
# cyclomatic branch, which scores a flat decoder the same as a deeply nested
# function. 10 is the Rust counterpart of the ceiling of 9 that Credo enforces
# on the Elixir in this repository.
cognitive-complexity-threshold = 10
